<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveler-Club - Creamos las mejores experiencias</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
        }

        /* Header / Navbar */
        header {
            background-color: #ffffff;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-name {
            font-size: 24px;
            font-weight: bold;
            color: #0d3b66;
            text-transform: lowercase;
        }

        .brand-slogan {
            font-size: 12px;
            color: #f4a261;
            font-style: italic;
            display: block;
            margin-top: -2px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #0d3b66;
        }

        .btn-phone {
            background-color: #0d3b66;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(13, 59, 102, 0.45), rgba(13, 59, 102, 0.25)), url('hero.jpg') no-repeat center center/cover;
            height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 0 10%;
            color: #fff;
        }

        .hero-badge {
            background-color: rgba(255, 255, 255, 0.2); /* Corrección: Completé el valor RGBA */
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div>
                <span class="brand-name">traveler-club</span>
                <span class="brand-slogan">Creamos las mejores experiencias</span>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Destinos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
        <a href="tel:123456789" class="btn-phone">📞 Llamar</a>
    </header>

    <section class="hero">
        <div class="hero-badge">¡Nuevo destino disponible!</div>
        <h1>Descubre tu próxima aventura</h1>
    </section>

</body>
</html>
